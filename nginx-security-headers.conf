# Security headers for the single-page app. `include` this inside every `location` that serves
# the SPA or its assets: Nginx drops server-level add_header lines in any location that has its
# own add_header (both SPA locations set Cache-Control). The API sets its own headers in Django.
#
# Content-Security-Policy, in short:
#   script-src 'self'          the bundle is self-hosted with no inline scripts (keep it that way)
#   style-src 'unsafe-inline'  voucher print sheets and some components use inline styles
#   img-src data: blob:        QR codes / logos in print sheets (data:) and logo previews (blob:)
#   connect-src 'self'         the API is same-origin; add its origin if VITE_API_BASE_URL is
#                              absolute, and the VITE_ERROR_REPORT_ENDPOINT origin if set
#   frame-ancestors 'none'     nobody may frame the app (clickjacking)
# Payment checkouts (Paystack, OPay) and wa.me links are page redirects, which CSP allows.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
